# Voorbeeld-caresheets voor Arthropoda Keeper (formaat arthropoda-caresheet/1)
#
# LET OP: dit zijn ruwe richtwaarden om de integratie mee te testen, gebaseerd
# op algemene houderijpraktijk. Controleer ze met een betrouwbare caresheet of
# je eigen ervaring voor je ze gebruikt om dieren te verzorgen of klimaat te
# sturen.
---
format: arthropoda-caresheet/1
species:
  scientific_name: Brachypelma hamorii
  common_names: {nl: Mexicaanse roodknievogelspin, en: Mexican redknee tarantula}
  group: tarantula
  development: molting_adult
  habitat: terrestrial
  taxonomy: {class: Arachnida, order: Araneae, family: Theraphosidae}
  urticating_hairs: true
  legal: {cites: II}
  diet: {prey: [krekel, kakkerlak, sprinkhaan], prey_size: "max. lichaamslengte"}
  enclosure: {substrate: "turf/kokosvezel, licht vochtig in een hoek", depth_cm: 10, water_dish: true}
care_profiles:
  - temp_day: [22, 26]
    temp_night: [18, 22]
    humidity: [55, 70]
    substrate_moisture: slightly_moist
    ventilation: medium
    feeding_interval_days: 14
    cleaning_interval_days: 30
    post_molt_fast_days: 10
  - stage: juvenile
    temp_day: [24, 27]
    feeding_interval_days: 5
    post_molt_fast_days: 5
  - season: winter
    months: [12, 1, 2]
    temp_day: [19, 23]
    temp_night: [16, 20]
    feeding_interval_days: 28
source: "Voorbeeldwaarden Arthropoda Keeper – controleren"
